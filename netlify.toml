[build]
  command = "pnpm run build"
  publish = ".output/public"
  SECRETS_SCAN_OMIT_KEYS = [
    "ANILIST_CLIENT_ID",
    "ANILIST_CLIENT_SECRET",
    "ANILIST_REDIRECT_URI",
    "MAL_CLIENT_ID",
    "MAL_CLIENT_SECRET",
    "MAL_REDIRECT_URI",
    "MANGADEX_CLIENT_ID",
    "MANGADEX_CLIENT_SECRET",
    "MANGADEX_REDIRECT_URI"
  ]

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
